aid: tristero
name: Tristero
description: >-
  Tristero is a trustless, cross-chain trading protocol backed by General
  Catalyst. On-chain traders use its API and Python/TypeScript SDKs to access
  deep liquidity across DEXs and CEXs for spot swaps of ERC-20 tokens across
  EVM chains (via Permit2 / EIP-712 signed orders), leveraged margin positions
  up to 10x, and cross-VM swaps into non-EVM assets like Bitcoin, Monero, and
  Litecoin through its Feather balance-sheet swap relay. Execution is
  non-custodial and MEV-protected, with real-time quote streaming over
  WebSocket, and the company's research roots are in on-chain dark pools and
  encrypted order matching.
